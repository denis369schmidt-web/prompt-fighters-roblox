name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ROJO: "7.4.4"
      LUNE: "0.8.9"
      SELENE: "0.27.1"
      STYLUA: "0.20.0"
      LUAU_LSP: "1.32.1"
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          mkdir -p "$HOME/bin"
          fetch() { curl -sSLf -o /tmp/t.zip "$1" && unzip -o -q /tmp/t.zip -d "$HOME/bin"; }
          fetch "https://github.com/rojo-rbx/rojo/releases/download/v$ROJO/rojo-$ROJO-linux-x86_64.zip"
          fetch "https://github.com/lune-org/lune/releases/download/v$LUNE/lune-$LUNE-linux-x86_64.zip"
          fetch "https://github.com/Kampfkarren/selene/releases/download/$SELENE/selene-$SELENE-linux.zip"
          fetch "https://github.com/JohnnyMorganz/StyLua/releases/download/v$STYLUA/stylua-linux-x86_64.zip"
          fetch "https://github.com/JohnnyMorganz/luau-lsp/releases/download/$LUAU_LSP/luau-lsp-linux.zip"
          curl -sSLf -o "$HOME/globalTypes.d.luau" \
            "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/$LUAU_LSP/scripts/globalTypes.d.luau"
          chmod +x "$HOME/bin"/*
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Format (StyLua)
        run: stylua --check src tests scripts

      - name: Lint (Selene)
        run: |
          selene src
          selene --config selene.lune.toml tests scripts

      - name: Type check (luau-lsp, Roblox types)
        run: |
          rojo sourcemap default.project.json -o sourcemap.json
          luau-lsp analyze --definitions="$HOME/globalTypes.d.luau" --sourcemap=sourcemap.json src

      - name: Tests (Lune)
        run: lune run tests/run.luau

      - name: Build place (Rojo)
        run: |
          mkdir -p build
          rojo build -o build/PromptFighters.rbxl
          lune run scripts/check-build.luau build/PromptFighters.rbxl

      - uses: actions/upload-artifact@v4
        with:
          name: PromptFighters-place
          path: build/PromptFighters.rbxl
